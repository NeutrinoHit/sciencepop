<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Простыми словами — NeutrinoHit</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #25313a;
      --muted: #5f6e79;
      --accent: #1f6f78;
      --line: rgba(43, 67, 91, 0.16);
      --paper: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: #f7f8fa;
      font: 17px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .site-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid #d7dde2;
      background: rgba(255, 255, 255, 0.92);
    }

    .site-nav a {
      padding: 6px 10px;
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
    }

    .site-nav a:hover {
      color: #16565d;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 52px 24px 72px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.1rem);
      line-height: 1.05;
    }

    .lead {
      max-width: 720px;
      margin: 14px 0 30px;
      color: var(--muted);
    }

    .lecture-list {
      display: grid;
      gap: 12px;
    }

    .lecture-list h2 {
      margin: 22px 0 2px;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .lecture-list h2:first-child {
      margin-top: 0;
    }

    .number {
      display: inline-block;
      min-width: 2em;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .lecture.planned summary {
      color: var(--muted);
      font-weight: 600;
    }

    .lecture {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 8px 22px rgba(43, 67, 91, 0.05);
    }

    .lecture summary {
      position: relative;
      padding: 16px 52px 16px 18px;
      cursor: pointer;
      list-style: none;
      font-size: 1.05rem;
      font-weight: 720;
    }

    .lecture summary::-webkit-details-marker {
      display: none;
    }

    .lecture summary::after {
      position: absolute;
      top: 50%;
      right: 18px;
      color: var(--accent);
      content: "+";
      font-size: 1.45rem;
      font-weight: 450;
      line-height: 1;
      transform: translateY(-50%);
    }

    .lecture[open] summary::after {
      content: "−";
    }

    .lecture-body {
      padding: 14px 18px 17px;
      border-top: 1px solid rgba(43, 67, 91, 0.1);
    }

    .lecture-body p {
      margin: 0;
      color: var(--muted);
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 13px;
    }

    .links a {
      padding: 6px 10px;
      border: 1px solid #b7c4ce;
      border-radius: 7px;
      color: #27475d;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 680;
    }

    .links a:hover {
      border-color: var(--accent);
      color: #16565d;
    }

    .links a.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .links a.primary:hover {
      background: #16565d;
      color: #ffffff;
    }

    .tag {
      align-self: center;
      padding: 4px 9px;
      border-radius: 7px;
      background: rgba(43, 67, 91, 0.08);
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Навигация">
    <a href="https://neutrinohit.github.io/">NeutrinoHit</a>
    <a href="../">Научпоп-лекции</a>
    <a href="./">Простыми словами</a>
  </nav>
  <main>
    <h1>Простыми словами</h1>
    <p class="lead">Короткие лекции по 5–10 минут. Каждый модуль отвечает на один вопрос о современной физике. Темы идут от простого к сложному: каждая опирается на предыдущие.</p>
    <section class="lecture-list" data-lecture-list aria-label="Короткие лекции"></section>
    <noscript>Для отображения каталога включите JavaScript.</noscript>
  </main>
  <script src="catalog.js"></script>
  <script defer src="https://neutrinohit.github.io/assets/analytics/cloudflare-web-analytics.js"></script>
</body>
</html>
